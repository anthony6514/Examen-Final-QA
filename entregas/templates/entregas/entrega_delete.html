{% extends "base.html" %}

{% block title %}Eliminar Entrega{% endblock %}

{% block content %}
<div class="container-fluid text-center">
    <h1>Eliminar Entrega</h1>

    <div class="alert alert-danger mt-4" role="alert">
        <h3>¿Estás seguro de que quieres eliminar la entrega <strong>{{ entrega.codigo }}</strong>?</h3>
        <p class="mt-3">Esta acción no se puede deshacer.</p>
    </div>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Sí, eliminar
            </button>
        </form>
        <a class="btn btn-secondary" href="{% url 'entrega_detail' entrega.id %}">
            Cancelar
        </a>
    </div>
</div>
{% endblock %}
